apiVersion: apps/v1
kind: Deployment
metadata:
  name: basketball-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basketball-app
  template:
    metadata:
      labels:
        app: basketball-app
    spec:
      containers:
        - name: basketball-app
          image: basketball-wear-shop:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15