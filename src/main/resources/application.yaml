spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: basketball-wear-shop
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  session:
    store-type: redis
    timeout: 30d
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    properties:
      hibernate:
        ddl-auto: validate
        show_sql: false
        format_sql: false
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    access: ${S3_ACCESS_KEY}
    secret: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET_NAME}
nba:
  score:
    api_key: ${API_KEY}
    url: ${API_URL}
app:
  default-admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    username: ${ADMIN_USERNAME}

server:
  port: ${SERVER_PORT}
  shutdown: graceful