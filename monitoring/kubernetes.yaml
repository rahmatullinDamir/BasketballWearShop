apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-vmalert
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-vmalert}
  template:
    metadata:
      labels: {app: shop-vmalert}
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.110.0
          args:
            - -rule=/etc/rules/*.yml
            - -datasource.url=$(VM_URL)
            - -notifier.url=http://shop-alertmanager:9093
            - -external.url=http://localhost:8880
            - -rule.validateExpressions=true
          env:
            - name: VM_URL
              valueFrom:
                configMapKeyRef:
                  name: shop-monitoring-settings
                  key: VM_URL
          ports: [{name: http, containerPort: 8880}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: rules, mountPath: /etc/rules, readOnly: true}
      volumes:
        - name: rules
          configMap: {name: shop-alert-rules}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-vmalert
spec:
  selector: {app: shop-vmalert}
  ports: [{name: http, port: 8880, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-alertmanager}
  template:
    metadata:
      labels: {app: shop-alertmanager}
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
            - --web.external-url=http://localhost:9093
          ports: [{name: http, containerPort: 9093}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: shop-alertmanager-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-alertmanager
spec:
  selector: {app: shop-alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-alert-inbox
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-alert-inbox}
  template:
    metadata:
      labels: {app: shop-alert-inbox}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: inbox
          image: python:3.12-alpine
          command: [python, -u, /app/server.py]
          env:
            - {name: DATA_PATH, value: /data/notifications.jsonl}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: code
          configMap: {name: shop-alert-inbox-code}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-alert-inbox
spec:
  selector: {app: shop-alert-inbox}
  ports: [{name: http, port: 8080, targetPort: http}]
