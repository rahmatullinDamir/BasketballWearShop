services:
  postgres:
    container_name: basketball_wear_shop_postgres
    image: postgres:15.5-alpine
    ports:
      - "5432:5432"
    env_file:
      - hidden_env.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data

  s3_storage:
    container_name: basketball_wear_shop_s3
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"
      - "9333:9333"
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3-auth.json"
    volumes:
      - s3_data:/data
      - ./s3-auth.json:/etc/seaweedfs/s3-auth.json

  redis:
    image: redis:alpine
    container_name: basketball-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
  s3_data: